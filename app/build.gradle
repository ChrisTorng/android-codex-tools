plugins { id 'com.android.application' }

android {
    namespace 'com.christorng.androidcodextools'
    compileSdk 35

    defaultConfig {
        applicationId "com.christorng.androidcodextools"
        minSdk 26
        targetSdk 35
        versionCode (project.hasProperty("versionCode") ? project.property("versionCode").toInteger() : 1)
        versionName (project.hasProperty("versionName") ? project.property("versionName") : "0.1.0")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
