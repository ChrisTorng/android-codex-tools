plugins { id 'com.android.application' }

android {
    namespace 'com.christorng.androidcodextools'

    signingConfigs {
        debug {
            storeFile file(System.getenv("HOME") + "/.android/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    compileSdk 35

    defaultConfig {
        applicationId "com.christorng.androidcodextools"
        minSdk 26
        targetSdk 35
        versionCode (project.hasProperty("versionCode") ? project.property("versionCode").toInteger() : 1)
        versionName (project.hasProperty("versionName") ? project.property("versionName") : "0.1.0")
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
}
