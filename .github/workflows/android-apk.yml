name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-codex-tools-debug-keystore-v1

      - name: Verify original signing key (never rotate silently)
        run: |
          set -euo pipefail
          EXPECTED="177f5e3fed59854e4203dafe13490a75c2438b37731ff0e7af7acbfe45a8e679"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "::error::Original signing keystore missing. Do not generate a new key: it cannot update existing installations."
            exit 1
          fi
          ACTUAL=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey |
            grep -m1 'SHA256:' | sed -E 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          echo "Keystore SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Signing certificate changed. Refusing to publish an incompatible APK."
            exit 1
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -PversionCode=${GITHUB_RUN_NUMBER} -PversionName=0.1.${GITHUB_RUN_NUMBER}

      - name: Verify APK signer
        run: |
          set -euo pipefail
          EXPECTED="177f5e3fed59854e4203dafe13490a75c2438b37731ff0e7af7acbfe45a8e679"
          OUTPUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -qi "Signer #1 certificate SHA-256 digest: $EXPECTED" ||
            { echo "::error::APK certificate mismatch"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: android-codex-tools-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
