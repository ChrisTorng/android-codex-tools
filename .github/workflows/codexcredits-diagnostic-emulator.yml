name: CodexCredits diagnostic emulator migration smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codexcredits-diagnostic-emulator.yml'
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7055017ca542b66db8716b458ab8534aa563ebc8
          path: legacy
      - uses: actions/checkout@v4
        with:
          repository: ChrisTorng/CodexCredits
          ref: be6ad2b7f057f2e4b2581093a6c0cbe14786cebc
          path: codexcredits
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Install SDK and NDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Prepare PNG icons
        working-directory: codexcredits
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("src-tauri/icons")
          source=Image.open(p/"icon.ico").convert("RGBA")
          for filename,size in (("icon.png",512),("128x128.png",128),("32x32.png",32)):
              source.resize((size,size),Image.Resampling.LANCZOS).save(p/filename)
          PY
      - run: npm install
        working-directory: codexcredits
      - name: Initialize and prepare Android app
        working-directory: codexcredits
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          npm run tauri -- android init --ci --skip-targets-install --config src-tauri/tauri.android.conf.json
          python3 mobile/android/prepare.py --legacy ../legacy
      - name: Compile Android x86_64 debug APK
        working-directory: codexcredits
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          npm run tauri -- android build --debug --apk --target x86_64 --config src-tauri/tauri.android.conf.json
      - name: Emulator launch test (clean app data)
        id: device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disk-size: 4G
          ram-size: 2048M
          disable-animations: true
          script: bash codexcredits/.github/scripts/android-emulator-smoke.sh
      - name: Upload startup crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-startup-log
          path: |
            codexcredits/android-emulator-launch.log
            codexcredits/android-emulator-crash.log
          if-no-files-found: ignore
