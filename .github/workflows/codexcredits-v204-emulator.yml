name: CodexCredits v2.0.4 RELEASE WebView startup verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codexcredits-v204-emulator.yml'
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7055017ca542b66db8716b458ab8534aa563ebc8
          path: legacy
      - uses: actions/checkout@v4
        with:
          repository: ChrisTorng/CodexCredits
          ref: 5cee53280d0c3bdf1a13ab41969385e61cd72bc5
          path: codexcredits
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Install SDK and NDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      # Recommended by ReactiveCircus/android-emulator-runner for Ubuntu:
      # enable /dev/kvm before launching the x86_64 AVD.
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare PNG icons
        working-directory: codexcredits
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("src-tauri/icons")
          source=Image.open(p/"icon.ico").convert("RGBA")
          for filename,size in (("icon.png",512),("128x128.png",128),("32x32.png",32)):
              source.resize((size,size),Image.Resampling.LANCZOS).save(p/filename)
          PY
      - run: npm install
        working-directory: codexcredits
      - name: Validate Rust mobile entry point
        working-directory: codexcredits
        run: python3 mobile/android/check_entrypoint.py
      - name: Create throwaway emulator-only signing key
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 5 -dname "CN=CI Emulator,O=Temporary,C=US" -noprompt
      - name: Initialize and prepare Android app
        working-directory: codexcredits
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          npm run tauri -- android init --ci --skip-targets-install --config src-tauri/tauri.android.conf.json
          python3 mobile/android/prepare.py --legacy ../legacy --release-keystore "$HOME/.android/debug.keystore"
      - name: Compile Android x86_64 optimized RELEASE APK
        working-directory: codexcredits
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          npm run tauri -- android build --apk --target x86_64 --config src-tauri/tauri.android.conf.json
      - name: Verify all JNI methods survived optimized release Dex
        working-directory: codexcredits
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n1)
          test -n "$APK"
          python3 mobile/android/check_dex_jni.py "$APK"
      - name: Emulator launch test (clean app data)
        id: device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-linux-hw-accel: false
          profile: pixel_6
          disk-size: 4G
          ram-size: 2048M
          disable-animations: true
          script: bash codexcredits/.github/scripts/android-release-emulator-smoke.sh
      - name: Upload startup crash evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-v204-startup-log
          path: |
            codexcredits/android-emulator-release-launch.log
            codexcredits/android-emulator-release-crash.log
            codexcredits/android-emulator-release-screen.png
            codexcredits/android-emulator-release-ui.xml
          if-no-files-found: ignore
